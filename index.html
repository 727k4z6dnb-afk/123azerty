<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beatelo — Audio Converter</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #1c1c1e; }
    header { border-bottom: 1px solid #ececf3; padding: 16px 24px; font-size: 24px; font-weight: 700; }
    main { padding: 32px 20px; }
    .container { max-width: 1000px; margin: auto; background: #fff4c4; border-radius: 28px; padding: clamp(24px, 5vw, 48px); }
    h1 { margin: 18px 0 8px; }
    p { line-height: 1.5; }
    #dropzone { background: #fff; border: 2px dashed #1c1c1e55; padding: 44px 24px; text-align: center; border-radius: 20px; cursor: pointer; }
    #dropzone strong { display: block; margin: 12px; font-size: 20px; }
    #dropzone:focus-visible { outline: 3px solid #2e4fd3; }
    #workspace { text-align: center; padding-top: 16px; }
    #coverbox { width: min(220px, 70vw); aspect-ratio: 1; position: relative; margin: 0 auto 18px; background: white; border-radius: 18px; overflow: hidden; display: grid; place-items: center; }
    #cover { display: none; width: 100%; height: 100%; object-fit: cover; }
    #placeholder { font-size: 76px; }
    #play { position: absolute; inset: 50% auto auto 50%; transform: translate(-50%,-50%); width: 64px; height: 64px; border-radius: 50%; background: #1c1c1e; color: white; border: 0; font-size: 25px; }
    #filename { display: block; overflow-wrap: anywhere; margin-bottom: 18px; }
    button, select { font: inherit; padding: 12px 20px; border-radius: 24px; border: 1px solid #bcbcbc; }
    button { background: #1c1c1e; color: white; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    .controls { margin-top: 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; }
    #status { min-height: 1.6em; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<header>BeatElo</header>
<main><div class="container">
  <a href="#converter">Convert &amp; compress</a>
  <h1 id="converter">Audio Converter</h1>
  <p>Turn MP3, WAV, FLAC, AAC and OGG files into another audio format.</p>
  <div id="dropzone" role="button" tabindex="0" aria-label="Choose audio file">
    <div style="font-size:34px">⇄</div><strong>Drop your audio files here</strong>
    <span>MP3 · WAV · FLAC · AAC · OGG</span>
  </div>
  <input id="file" type="file" accept="audio/*,.mp3,.wav,.flac,.aac,.ogg,.m4a,.opus,.aiff" hidden>
  <section id="workspace" hidden>
    <div id="coverbox">
      <img id="cover" alt="Album cover"><span id="placeholder">♫</span>
      <button id="play" type="button" aria-label="Play or pause">▶</button>
    </div>
    <strong id="filename"></strong>
    <button id="replace" type="button">Replace Audio</button>
    <div class="controls">
      <label for="format">Convert to:</label>
      <select id="format"><option value="mp3">MP3</option><option value="wav">WAV</option><option value="flac">FLAC</option><option value="aac">AAC</option><option value="ogg">OGG</option></select>
      <button id="convert" type="button">Convert Audio</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <audio id="audio" preload="metadata"></audio>
  </section>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
<script type="module" src="/src.js"></script>
</body>
</html>
